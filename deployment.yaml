apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-insurance-prediction-deployment
  labels:
    app: travel-insurance-prediction
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-insurance-prediction
  template:
    metadata:
      labels:
        app: travel-insurance-prediction
    spec:
      containers:
      - name: prediction-service
        image: travel-insurance-prediction:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9696
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9696
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 9696
          initialDelaySeconds: 5
          periodSeconds: 10
